name: Poll job boards

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# One run at a time, so two runs can't send the same alert or clash on state.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main, not the commit at trigger time: a queued run must see the state the run before it saved.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/functions/requirements.txt
      - run: pip install -r requirements.txt
      - name: Poll and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
        run: python -m job_alerts.cli
      # Always save: alerts already sent must stay marked seen even if a later job failed.
      - name: Save seen jobs
        if: always()
        run: ../../.github/scripts/save-state.sh state.json health.json
