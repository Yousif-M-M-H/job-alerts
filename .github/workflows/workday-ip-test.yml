name: Workday IP test (temporary)

# One-off: why does Workday answer 429 to poll.yml but 200 to curl from the same servers? Deleted after the test.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt "httpx[http2]"
      - name: Probe Workday
        run: |
          SEL=https://selinc.wd1.myworkdayjobs.com/wday/cxs/selinc/SEL/jobs
          BODY='{"appliedFacets":{},"limit":20,"offset":0,"searchText":""}'
          echo "RESULT curl http2: $(curl -s --http2 -o /dev/null -w '%{http_code} %{http_version}' -X POST -H 'Content-Type: application/json' -A 'job-alerts/0.1' -d "$BODY" $SEL)"
          sleep 6
          echo "RESULT curl http1.1: $(curl -s --http1.1 -o /dev/null -w '%{http_code} %{http_version}' -X POST -H 'Content-Type: application/json' -A 'job-alerts/0.1' -d "$BODY" $SEL)"
          sleep 6
          python - <<'PY'
          import time, httpx
          url = "https://selinc.wd1.myworkdayjobs.com/wday/cxs/selinc/SEL/jobs"
          body = {"appliedFacets": {}, "limit": 20, "offset": 0, "searchText": ""}
          headers = {"User-Agent": "job-alerts/0.1", "Accept": "application/json"}
          for http2 in (True, False):
              with httpx.Client(http2=http2, headers=headers, timeout=30) as client:
                  r = client.post(url, json=body)
                  print("RESULT httpx http2=%s: %s %s" % (http2, r.status_code, r.http_version))
              time.sleep(6)
          PY
