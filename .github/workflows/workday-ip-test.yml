name: Workday IP test (temporary)

# One-off: why does Workday answer 429 to poll.yml but 200 to curl from the same servers? Deleted after the test.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Probe Workday
        run: |
          SEL=https://selinc.wd1.myworkdayjobs.com/wday/cxs/selinc/SEL/jobs
          BODY='{"appliedFacets":{},"limit":20,"offset":0,"searchText":""}'
          echo "RESULT curl default headers: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$BODY" $SEL)"
          sleep 6
          echo "RESULT curl with our headers: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' -A 'job-alerts/0.1' -d "$BODY" $SEL)"
          sleep 6
          python - <<'EOF'
          import requests
          from job_alerts.adapters.http import build_session
          url = "https://selinc.wd1.myworkdayjobs.com/wday/cxs/selinc/SEL/jobs"
          body = {"appliedFacets": {}, "limit": 20, "offset": 0, "searchText": ""}
          print("RESULT python adapter session:", build_session().post(url, json=body, timeout=30).status_code)
          import time; time.sleep(6)
          print("RESULT python plain requests:", requests.post(url, json=body, timeout=30).status_code)
          EOF
